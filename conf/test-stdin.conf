# Configuration for dwcore_test: raw audio from standard input, transmit
# audio discarded, no PTT.  Sample rate must match the audio you pipe in
# (gen_packets defaults to 44100 Hz, 16 bit, mono).
ADEVICE stdin null
ARATE 44100
ACHANNELS 1
CHANNEL 0
MYCALL N0CALL
MODEM 1200
# Channel access, same units as the KISS parameters (10 ms) and 0-255.
TXDELAY 30
PERSIST 63
SLOTTIME 10
TXTAIL 5
